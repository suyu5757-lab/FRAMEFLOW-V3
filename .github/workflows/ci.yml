name: FRAMEFLOW CI

on:
  push:
  pull_request:

concurrency:
  group: frameflow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run backend tests
        run: >-
          python -m unittest
          tests.test_maintenance_v3
          tests.test_v3
          tests.test_v3_dashboard
          tests.test_v3_delivery
          tests.test_v3_function_matrix
          tests.test_v3_settings
          tests.test_asset_board
          tests.test_asset_v3_improvements
          tests.test_fusion_prompt_flow
          tests.test_opencode_client
          tests.test_jimeng_cli
          -v
      - name: Run root JavaScript contract tests
        run: npm test
      - name: Run frontend tests
        run: npm test
        working-directory: web
      - name: Check frontend types
        run: npx tsc -b --pretty false
        working-directory: web
      - name: Build frontend
        run: npm run build
        working-directory: web
      - name: Install Playwright Chromium
        run: npx playwright install chromium
        working-directory: web
      - name: Run browser acceptance tests
        run: npm run test:e2e
        working-directory: web
      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Filter *.js -File |
            Where-Object { $_.FullName -notmatch '[\\/]node_modules[\\/]' }
          foreach ($file in $files) {
            node --check $file.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
